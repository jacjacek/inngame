      .dark { fill: #11120F; }
      .title { font-size: 28px; font-weight: 700; letter-spacing: -.6px; }
      .h1 { font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
      .h2 { font-size: 15px; font-weight: 650; }
      .body { font-size: 13px; }
      .small { font-size: 11px; }
      .tiny { font-size: 9px; }
      .caps { font-size: 9px; font-weight: 750; letter-spacing: 1.2px; }
      .divider { stroke: rgba(255,255,255,.075); stroke-width: 1; }
